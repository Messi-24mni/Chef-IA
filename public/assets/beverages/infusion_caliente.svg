  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Steam -->
  <path d="M350 185 Q332 145 352 110 Q370 80 350 55" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
