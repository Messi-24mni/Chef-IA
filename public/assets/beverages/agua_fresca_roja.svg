  <rect x="405" y="260" width="48" height="48" rx="10" transform="rotate(14 429 284)" fill="#FFFFFF" fill-opacity="0.44" stroke="#FFE4E6" stroke-width="2"/>
  <rect x="365" y="315" width="44" height="44" rx="10" transform="rotate(6 387 337)" fill="#FFFFFF" fill-opacity="0.35"/>
